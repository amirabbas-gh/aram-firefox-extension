name: Release

# Runs on every push to main (including when a PR is merged into main).
#
# 1. Add a changeset (`npx changeset`), commit it, and push/merge to main.
#    changesets/action then opens/updates a "chore: version packages" PR
#    that bumps package.json + manifest.json and updates CHANGELOG.md.
# 2. When that version PR is merged, this workflow runs again. There are
#    no pending changesets left (`hasChangesets == 'false'`), which is
#    the signal to build the AMO zip and publish a GitHub Release.
on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create release pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        if: steps.changesets.outputs.hasChangesets == 'false'
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists; skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint extension
        if: steps.version.outputs.publish == 'true'
        run: npx web-ext lint

      - name: Package for AMO
        if: steps.version.outputs.publish == 'true'
        run: npx web-ext build --overwrite-dest --filename=aram-{version}.zip

      - name: Prepare release assets
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          ZIP=$(ls web-ext-artifacts/*.zip | head -1)
          test -n "$ZIP"
          cp "$ZIP" "dist/aram-${VERSION}.zip"

          python3 - <<'PY'
          import os, zipfile
          from pathlib import Path

          version = os.environ["VERSION"]
          zip_path = Path("dist") / f"aram-{version}.zip"
          with zipfile.ZipFile(zip_path) as zf:
              names = zf.namelist()
          if "manifest.json" not in names:
              raise SystemExit("manifest.json missing from zip root")
          blocked = (".github/", "docs/", "scripts/", "node_modules/", ".changeset/")
          leaked = [n for n in names if n.startswith(blocked)]
          if leaked:
              raise SystemExit(f"zip contains excluded paths: {leaked}")
          print(f"zip ok: {len(names)} files")
          PY

          (cd dist && sha256sum "aram-${VERSION}.zip" > "aram-${VERSION}.zip.sha256")
          ls -la dist web-ext-artifacts

      - name: Create GitHub Release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/aram-${{ steps.version.outputs.version }}.zip
            dist/aram-${{ steps.version.outputs.version }}.zip.sha256
          body: |
            Firefox add-on package for [addons.mozilla.org](https://addons.mozilla.org).

            Upload `aram-${{ steps.version.outputs.version }}.zip` at the [AMO developer hub](https://addons.mozilla.org/developers/addon/submit/). Mozilla signs the add-on during review; this zip is unsigned on purpose.

            This file is not a signed `.xpi`. Firefox will not permanently install it from GitHub until AMO has signed it.
